[workspace]
authors = ["Karl Theodor Ruby <karl.ruby@tuta.com>"]
channels = ["file:///home/karl/Git/mojo-window/output", "conda-forge", "https://conda.modular.com/max", "https://repo.prefix.dev/modular-community"]
name = "mojo-create"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
example = "bash scripts/example.sh"
test = "bash scripts/test.sh"
precompile = "mkdir -p build && mojo precompile src/create -o build/create.mojoc"
format = "mojo format src examples tests"
setup = "git config core.hooksPath .githooks && git config blame.ignoreRevsFile .git-blame-ignore-revs"

[dependencies]
mojo = ">=1.0.0,<2"
mojo-window = ">=0.3,<0.4"
sdl3 = ">=3.4,<4"
freetype = ">=2.13,<3"
libpng = ">=1.6,<2"
libjpeg-turbo = ">=3,<4"
libsndfile = ">=1.2,<2"
